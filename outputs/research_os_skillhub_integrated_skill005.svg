  <text class="tiny muted" x="496" y="322">这四个不是被 Skill005 替代，而是吸收 Skill005 reference 后变强</text>

  <rect class="oldskill" x="510" y="356" width="380" height="104"/>
  <text class="label" x="700" y="386" text-anchor="middle">Skill001: 强案例蒸馏</text>
  <text class="tiny" x="700" y="410" text-anchor="middle">把优秀案例的思考动作沉淀进 thinking skills</text>
  <text class="tiny" x="700" y="431" text-anchor="middle">新增吸收：event reasoning / bottleneck framework</text>

  <rect class="oldskill" x="952" y="356" width="380" height="104"/>
  <text class="label" x="1142" y="386" text-anchor="middle">Skill002: SemiAnalysis 技术蒸馏</text>
  <text class="tiny" x="1142" y="410" text-anchor="middle">workload -> hardware -> physical constraint</text>
  <text class="tiny" x="1142" y="431" text-anchor="middle">新增吸收：AI infrastructure bottleneck method</text>

  <rect class="oldskill" x="510" y="532" width="380" height="104"/>
  <text class="label" x="700" y="562" text-anchor="middle">Skill003: Equity Research Playbook</text>
  <text class="tiny" x="700" y="586" text-anchor="middle">证据 -> 机制 -> 财务影响 -> price-in</text>
  <text class="tiny" x="700" y="607" text-anchor="middle">新增吸收：受益者角色 / evidence stack / event stage</text>

  <rect class="oldskill" x="952" y="532" width="380" height="104"/>
  <text class="label" x="1142" y="562" text-anchor="middle">Skill004: 产业链卡点蒸馏</text>
  <text class="tiny" x="1142" y="586" text-anchor="middle">先排层级，再排公司</text>
  <text class="tiny" x="1142" y="607" text-anchor="middle">新增吸收：cross-industry bottleneck backbone</text>

  <path class="arrow" d="M430 450 C445 450 455 450 470 450"/>

  <rect class="lane" x="1420" y="260" width="900" height="456"/>
  <text class="lane-title" x="1446" y="298">3. 新增 Skill005：事件化层 + 可复用 reference</text>
  <text class="tiny muted" x="1446" y="322">它不是替代 1-4，而是把公开观点变成可审计事件，并把高价值框架沉淀给全系统</text>

  <rect class="newskill" x="1462" y="356" width="390" height="118"/>
  <text class="label" x="1657" y="386" text-anchor="middle">Skill005: Research Event Distillation</text>
  <text class="tiny" x="1657" y="411" text-anchor="middle">公开观点 -> timestamped research event</text>
  <text class="tiny" x="1657" y="432" text-anchor="middle">claim / evidence / ticker role / stage / price-in</text>
  <text class="tiny" x="1657" y="453" text-anchor="middle">判断：lead / evidence / context / validation / noise</text>

  <rect class="framework" x="1900" y="344" width="368" height="86"/>
  <text class="label" x="2084" y="374" text-anchor="middle">AI Infrastructure Bottleneck</text>
  <text class="tiny" x="2084" y="399" text-anchor="middle">workload -> stressed layer -> scarce capability</text>
  <text class="tiny" x="2084" y="419" text-anchor="middle">AI 基建专用框架</text>

  <rect class="framework" x="1900" y="474" width="368" height="86"/>
  <text class="label" x="2084" y="504" text-anchor="middle">Cross-Industry Bottleneck</text>
  <text class="tiny" x="2084" y="529" text-anchor="middle">demand shock -> constrained layer -> beneficiary</text>
  <text class="tiny" x="2084" y="549" text-anchor="middle">跨行业通用框架</text>

